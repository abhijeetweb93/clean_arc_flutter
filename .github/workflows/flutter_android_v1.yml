name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: flutter-runner
#    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      - name: Install dependencies
        run: flutter pub get

#      - name: Analyze
#        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Cleanup
        if: always()
        run: |
          rm -rf ./clean_arc_flutter
          echo "Cleanup completed"
